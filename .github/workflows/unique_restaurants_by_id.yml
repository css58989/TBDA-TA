name: Unique Restaurants By Id

on:
  workflow_dispatch:
    inputs:
      r2_prefix:
        description: "R2 key prefix to scan"
        required: false
        default: "merged-restaurant-info/year=2025/month=09/day=17/"
        type: string
      key_contains:
        description: "Only include keys containing this substring"
        required: false
        default: "MergedRestaurantsInfo.json"
        type: string
      max_files:
        description: "Optional max files to scan (leave empty for all)"
        required: false
        default: ""
        type: string
  schedule:
    # Weekly Monday 03:45 UTC (after attribute profile, before market structure)
    - cron: "45 3 * * 1"

permissions:
  contents: read

jobs:
  export:
    name: Build unique-restaurants-by-id Excel artifact
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify R2 secrets are present
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for name in CF_R2_ACCESS_KEY_ID CF_R2_SECRET_ACCESS_KEY CF_R2_ENDPOINT_URL CF_R2_BUCKET_NAME; do
            value="${!name}"
            if [ -z "${value// }" ]; then
              echo "::error::$name is empty or not set in repository secrets"
              missing=1
            else
              echo "$name is set (length=${#value})"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Diagnose R2 access
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: ${{ github.event.inputs.r2_prefix || 'merged-restaurant-info/year=2025/month=09/day=17/' }}
        run: python scripts/diagnose_r2.py

      - name: Build unique restaurants Excel
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_PREFIX: ${{ github.event.inputs.r2_prefix || 'merged-restaurant-info/year=2025/month=09/day=17/' }}
          R2_KEY_CONTAINS: ${{ github.event.inputs.key_contains || 'MergedRestaurantsInfo.json' }}
          INSIGHTS_MODE: r2
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ -n "${{ github.event.inputs.max_files }}" ]; then
            EXTRA_ARGS+=(--max-files "${{ github.event.inputs.max_files }}")
          fi
          mkdir -p outputs/unique_restaurants_by_id
          python scripts/unique_restaurants_by_id.py \
            --mode r2 \
            --prefix "${R2_PREFIX}" \
            --key-contains "${R2_KEY_CONTAINS}" \
            --out-dir outputs/unique_restaurants_by_id \
            "${EXTRA_ARGS[@]}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: unique-restaurants-by-id
          path: outputs/unique_restaurants_by_id/
          if-no-files-found: error
          retention-days: 30
